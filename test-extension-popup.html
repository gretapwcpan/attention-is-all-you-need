<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Extension Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        
        .test-container {
            background: #1a1a1a;
            border: 2px solid #00ffff;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            width: 380px;
            height: 600px;
            position: relative;
            overflow: hidden;
        }
        
        .test-header {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
            color: #00ffff;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .test-header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }
        
        iframe {
            width: 380px;
            height: calc(100% - 60px);
            border: none;
            display: block;
        }
        
        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #39ff14;
            padding: 20px;
            max-width: 300px;
            color: #39ff14;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        }
        
        .info-panel h2 {
            margin: 0 0 15px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #39ff14;
        }
        
        .info-panel p {
            font-size: 12px;
            line-height: 1.6;
            color: #ffffff;
            margin: 10px 0;
        }
        
        .status {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>[EXTENSION TEST ENVIRONMENT]</h1>
        </div>
        <iframe src="popup/popup.html"></iframe>
    </div>
    
    <div class="info-panel">
        <h2>[SYSTEM STATUS]</h2>
        <p class="status">CYBERPUNK THEME: ACTIVE</p>
        <p>Width: 380px (Fixed)</p>
        <p>Height: 600px</p>
        <p>Theme: Neon Cyberpunk</p>
        <p>Mode: Test Environment</p>
    </div>
</body>
</html>
