<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixelated egg shape with proper oval form -->
  <!-- Top curve -->
  <rect x="26" y="10" width="12" height="2" fill="#FFF8E7"/>
  <rect x="22" y="12" width="20" height="2" fill="#FFF8E7"/>
  <rect x="20" y="14" width="24" height="2" fill="#FFF8E7"/>
  <rect x="18" y="16" width="28" height="2" fill="#FFF8E7"/>
  <rect x="16" y="18" width="32" height="2" fill="#FFF8E7"/>
  <rect x="14" y="20" width="36" height="2" fill="#FFF8E7"/>
  
  <!-- Middle body (widest part) -->
  <rect x="12" y="22" width="40" height="2" fill="#FFF8E7"/>
  <rect x="12" y="24" width="40" height="2" fill="#FFF8E7"/>
  <rect x="12" y="26" width="40" height="2" fill="#FFF8E7"/>
  <rect x="12" y="28" width="40" height="2" fill="#FFF8E7"/>
  <rect x="12" y="30" width="40" height="2" fill="#FFF8E7"/>
  <rect x="12" y="32" width="40" height="2" fill="#FFF8E7"/>
  
  <!-- Bottom curve (more gradual) -->
  <rect x="12" y="34" width="40" height="2" fill="#FFF8E7"/>
  <rect x="14" y="36" width="36" height="2" fill="#FFF8E7"/>
  <rect x="14" y="38" width="36" height="2" fill="#FFF8E7"/>
  <rect x="16" y="40" width="32" height="2" fill="#FFF8E7"/>
  <rect x="16" y="42" width="32" height="2" fill="#FFF8E7"/>
  <rect x="18" y="44" width="28" height="2" fill="#FFF8E7"/>
  <rect x="20" y="46" width="24" height="2" fill="#FFF8E7"/>
  <rect x="22" y="48" width="20" height="2" fill="#FFF8E7"/>
  <rect x="24" y="50" width="16" height="2" fill="#FFF8E7"/>
  <rect x="26" y="52" width="12" height="2" fill="#FFF8E7"/>
  
  <!-- Subtle shading for depth -->
  <rect x="38" y="20" width="8" height="2" fill="#F0E5D0" opacity="0.5"/>
  <rect x="40" y="24" width="8" height="2" fill="#F0E5D0" opacity="0.5"/>
  <rect x="40" y="28" width="8" height="2" fill="#F0E5D0" opacity="0.5"/>
  
  <!-- Highlight for 3D effect -->
  <rect x="20" y="18" width="4" height="2" fill="#FFFEF5" opacity="0.7"/>
  <rect x="18" y="22" width="4" height="2" fill="#FFFEF5" opacity="0.7"/>
</svg>
