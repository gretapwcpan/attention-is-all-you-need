<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Minecraft-style adult creature -->
  <!-- Head -->
  <rect x="14" y="8" width="36" height="32" fill="#ffcc99" stroke="#8b4513" stroke-width="2"/>
  <!-- Crown/Hat -->
  <rect x="14" y="8" width="36" height="6" fill="#ffd700"/>
  <rect x="22" y="4" width="4" height="4" fill="#ffd700"/>
  <rect x="30" y="4" width="4" height="4" fill="#ffd700"/>
  <rect x="38" y="4" width="4" height="4" fill="#ffd700"/>
  <!-- Eyes with glasses -->
  <rect x="18" y="20" width="10" height="6" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="36" y="20" width="10" height="6" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="28" y="22" width="8" height="2" fill="#000000"/>
  <rect x="20" y="22" width="6" height="3" fill="#000000"/>
  <rect x="38" y="22" width="6" height="3" fill="#000000"/>
  <!-- Beard -->
  <rect x="22" y="32" width="20" height="6" fill="#8b4513"/>
  <rect x="24" y="38" width="16" height="2" fill="#8b4513"/>
  <!-- Body (armor) -->
  <rect x="16" y="40" width="32" height="20" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <rect x="20" y="44" width="24" height="4" fill="#808080"/>
  <rect x="20" y="52" width="24" height="4" fill="#808080"/>
  <!-- Arms (strong) -->
  <rect x="8" y="42" width="8" height="14" fill="#ffcc99" stroke="#8b4513" stroke-width="2"/>
  <rect x="48" y="42" width="8" height="14" fill="#ffcc99" stroke="#8b4513" stroke-width="2"/>
  <!-- Legs -->
  <rect x="22" y="56" width="8" height="8" fill="#4169e1" stroke="#000080" stroke-width="2"/>
  <rect x="34" y="56" width="8" height="8" fill="#4169e1" stroke="#000080" stroke-width="2"/>
</svg>
