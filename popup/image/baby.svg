<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Baby Dragon - Cute and small -->
  
  <!-- Head -->
  <rect x="24" y="18" width="16" height="2" fill="#A8E6CF"/>
  <rect x="22" y="20" width="20" height="2" fill="#A8E6CF"/>
  <rect x="20" y="22" width="24" height="2" fill="#A8E6CF"/>
  <rect x="20" y="24" width="24" height="2" fill="#A8E6CF"/>
  <rect x="22" y="26" width="20" height="2" fill="#A8E6CF"/>
  
  <!-- Eyes (big and cute) -->
  <rect x="24" y="22" width="4" height="2" fill="#000000"/>
  <rect x="36" y="22" width="4" height="2" fill="#000000"/>
  <rect x="25" y="22" width="2" height="1" fill="#FFFFFF"/>
  <rect x="37" y="22" width="2" height="1" fill="#FFFFFF"/>
  
  <!-- Tiny horns -->
  <rect x="22" y="18" width="2" height="2" fill="#7FD8BE"/>
  <rect x="40" y="18" width="2" height="2" fill="#7FD8BE"/>
  
  <!-- Body (chubby) -->
  <rect x="22" y="28" width="20" height="2" fill="#A8E6CF"/>
  <rect x="20" y="30" width="24" height="2" fill="#A8E6CF"/>
  <rect x="20" y="32" width="24" height="2" fill="#A8E6CF"/>
  <rect x="22" y="34" width="20" height="2" fill="#A8E6CF"/>
  <rect x="24" y="36" width="16" height="2" fill="#A8E6CF"/>
  
  <!-- Belly (lighter) -->
  <rect x="26" y="30" width="12" height="2" fill="#C8F4DC"/>
  <rect x="26" y="32" width="12" height="2" fill="#C8F4DC"/>
  
  <!-- Tiny wings -->
  <rect x="16" y="28" width="4" height="2" fill="#7FD8BE"/>
  <rect x="14" y="30" width="6" height="2" fill="#7FD8BE"/>
  <rect x="44" y="28" width="4" height="2" fill="#7FD8BE"/>
  <rect x="44" y="30" width="6" height="2" fill="#7FD8BE"/>
  
  <!-- Small tail -->
  <rect x="40" y="34" width="4" height="2" fill="#A8E6CF"/>
  <rect x="42" y="36" width="4" height="2" fill="#A8E6CF"/>
  <rect x="44" y="38" width="4" height="2" fill="#A8E6CF"/>
  
  <!-- Tiny feet -->
  <rect x="24" y="38" width="4" height="2" fill="#7FD8BE"/>
  <rect x="36" y="38" width="4" height="2" fill="#7FD8BE"/>
</svg>
