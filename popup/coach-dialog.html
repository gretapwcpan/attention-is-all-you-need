<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>browser content analyst</title>
    <link rel="stylesheet" href="coach-dialog.css">
</head>
<body>
    <div class="coach-dialog">
        <div class="coach-header">
            <div class="coach-avatar">🤖</div>
            <div class="coach-info">
                <h2>browser content analyst</h2>
                <span class="coach-status" id="coachStatus">Analyzing your reading...</span>
            </div>
        </div>
        
        <div class="coach-messages" id="coachMessages">
            <!-- Messages will be added here -->
        </div>
        
        <div class="coach-input">
            <input type="text" id="userInput" placeholder="Ask me about your reading..." />
            <button id="sendButton">Send</button>
        </div>
        
        <div class="coach-actions">
            <button id="getSummaryBtn" class="action-btn">Get Today's Summary</button>
            <button id="getInsightsBtn" class="action-btn">Reading Insights</button>
            <button id="closeBtn" class="action-btn secondary">Close</button>
        </div>
    </div>
    
    <script src="coach-dialog.js"></script>
</body>
</html>
