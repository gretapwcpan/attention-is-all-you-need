<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Insights</title>
    <link rel="stylesheet" href="coach-dialog.css">
</head>
<body>
    <div class="coach-dialog">
        <div class="coach-header">
            <div class="coach-avatar"></div>
            <div class="coach-info">
                <h2>FocusFlow Mind Reader</h2>
                <span class="coach-status" id="coachStatus">Ready to help you focus!</span>
            </div>
        </div>
        
        <div class="coach-messages" id="coachMessages">
            <!-- Boot sequence message -->
            <div class="message coach">
                <span>Welcome to FocusFlow Insights! </span>
            </div>
            <div class="message coach">
                <span>Analyzing your browsing patterns... ✓</span>
            </div>
            <div class="message coach">
                <span>AI mind reader ready... ✓</span>
            </div>
            <div class="message coach">
                <span>How can I help you improve your focus today?</span>
            </div>
        </div>
        
        <div class="coach-input">
            <input type="text" id="userInput" placeholder="Ask me anything..." />
            <button id="sendButton">Send</button>
        </div>
        
        <div class="coach-actions">
            <button id="getSummaryBtn" class="action-btn"> Today's Summary</button>
            <button id="getInsightsBtn" class="action-btn"> Get Insights</button>
            <button id="closeBtn" class="action-btn secondary">Close</button>
        </div>
    </div>
    
    <script src="coach-dialog.js"></script>
</body>
</html>
