<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttenGame - Daily Goals</title>
    <link rel="stylesheet" href="todo-manager.css">
    <!-- Sortable.js for drag and drop (local copy for offline use) -->
    <script src="../libs/sortable.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" id="backBtn">← Back</button>
            <h1>Daily Goals </h1>
            <p class="subtitle">Build focus through purposeful objectives</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="totalGoals">0</span>
                <span class="stat-label">Goals</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="completedGoals">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="todayProgress">0%</span>
                <span class="stat-label">Progress</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="streak">0 days</span>
                <span class="stat-label">Streak 🔥</span>
            </div>
        </div>

        <!-- Motivational Message -->
        <div id="motivationalMessage" class="motivational-message"></div>

        <!-- Goal Input Section -->
        <div class="goal-input-section">
            <div class="input-group">
                <input type="text" id="goalInput" placeholder="Add a new goal for today...">
                <button id="addGoalBtn">➕ Add Goal</button>
            </div>
        </div>

        <!-- Category Filter -->
        <div class="category-filter-section">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <!-- Categories will be dynamically added here -->
            </select>
        </div>

        <!-- Goals List -->
        <div class="goals-list" id="goalsList">
            <!-- Goals will be dynamically added here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon"></div>
            <p>No goals yet! Add your first goal to advance to the next mastery stage.</p>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">
                Today's Progress: <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <button id="viewAnalyticsBtn" class="footer-btn"> View Analytics</button>
            <button id="clearCompletedBtn" class="footer-btn">Clear Completed</button>
        </div>
    </div>

    <!-- Goal Template -->
    <template id="goalTemplate">
        <div class="goal-item" data-goal-id="">
            <span class="drag-handle">⋮⋮</span>
            <span class="goal-title"></span>
            <span class="category-badge"></span>
            <input type="text" class="goal-edit-input" style="display: none;">
            <div class="goal-actions">
                <button class="edit-goal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    Edit
                </button>
                <button class="save-goal" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save
                </button>
                <button class="cancel-goal" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    Cancel
                </button>
                <button class="complete-goal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                    Complete
                </button>
                <button class="delete-goal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Coin Celebration Container -->
    <div id="coinCelebration" class="coin-celebration"></div>

    <!-- SVG Definitions -->
    <svg style="display: none;">
        <defs>
            <g id="goldCoin">
                <circle cx="12" cy="12" r="10" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
                <circle cx="12" cy="12" r="8" fill="none" stroke="#FFA500" stroke-width="0.5"/>
                <text x="12" y="16" text-anchor="middle" fill="#FFA500" font-size="12" font-weight="bold">★</text>
            </g>
        </defs>
    </svg>

    <script type="module" src="todo-manager.js"></script>
</body>
</html>
