<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Cyberpunk Edition</title>
    <link rel="stylesheet" href="todo-manager.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>MISSION CONTROL</h1>
            <p class="subtitle">Strategic Objective Management System</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="totalGoals">0</span>
                <span class="stat-label">MISSIONS</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="completedTodos">0</span>
                <span class="stat-label">COMPLETED</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="progressPercent">0%</span>
                <span class="stat-label">PROGRESS</span>
            </div>
        </div>

        <!-- Goal Input Section -->
        <div class="goal-input-section">
            <div class="input-group">
                <input type="text" id="goalInput" placeholder="Enter new mission objective...">
                <button id="addGoalBtn">[ DEPLOY ]</button>
            </div>
        </div>

        <!-- Goals List -->
        <div class="goals-list" id="goalsList">
            <!-- Goals will be dynamically added here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">[NO MISSIONS]</div>
            <p>System awaiting mission objectives. Deploy your first mission to begin.</p>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">
                SYSTEM EFFICIENCY: 0%
            </div>
        </div>
    </div>

    <script src="todo-manager.js"></script>
</body>
</html>
